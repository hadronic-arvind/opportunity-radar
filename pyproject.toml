[project]
name = "opportunity-radar"
version = "0.8.0"
description = "A local-first, low-overhead opportunity monitoring pipeline"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []
classifiers = ["License :: Other/Proprietary License"]

[tool.ruff]
target-version = "py39"
line-length = 88
extend-exclude = ["monitor/taxonomy_catalog.json"]

[tool.ruff.lint]
# Introduce correctness checks without mass-reformatting the existing runtime.
select = ["E9", "F63", "F7", "F82"]
